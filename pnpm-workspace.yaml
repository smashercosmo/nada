packages:
  - src/*
  - projects/*

allowBuilds:
  msgpackr-extract: true
  node: true
  node-pty: true

autoInstallPeers: true
autoDedupe: true
cleanupUnusedCatalogs: true
hoist: false
saveExact: true


catalogs:
  deps:
    "@clack/prompts": 1.8.1
    yaml: 2.9.1
  dev:
    actions-up: 1.21.0
    jiti: 2.7.0
    oxfmt: 0.71.0
    tsdown: 0.23.0
  lint:
    '@eslint/js': 10.0.1
    '@eslint/json': 2.1.0
    es-check: 9.8.1
    eslint: 10.11.0
    eslint-plugin-n: 18.4.0
    eslint-plugin-package-json: 1.10.1
    globals: 17.13.0
    oxlint: 1.86.0
    oxlint-tsgolint: 7.0.2003
    typescript-eslint: 8.71.0
  pnpm:
    '@pnpm/catalogs.types': 1100.0.1
    '@pnpm/cli.meta': 1100.1.1
    '@pnpm/cli.utils': 1101.0.30
    '@pnpm/config.reader': 1102.3.2
    '@pnpm/deps.inspection.commands': 1101.0.8
    '@pnpm/deps.inspection.list': 1101.0.8
    '@pnpm/find-workspace-dir': 1000.1.5
    '@pnpm/resolving.registry.types': 1100.2.2
  test:
    "@vitest/coverage-v8": 5.0.3
    cli-testing-library: 4.0.0
    node-pty: 1.1.0
    vitest: 5.0.3
  types:
    '@pnpm/types': 1102.1.1
    "@types/node": 26.6.4
    ts-extras: 1.3.0


catalogMode: strict
